<ion-header>
  <ion-toolbar color="success">
    <ion-title>Mis Vehículos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="salir()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="cargarVehiculos($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <p class="ion-margin-bottom"><strong>Vecino:</strong> {{ auth.usuario()?.nombre }}</p>
  @for (v of vehiculos(); track v.id) {
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ v.patente }} — {{ v.marca }} {{ v.modelo }}</ion-card-title>
        <ion-card-subtitle>{{ v.tipo }} | Año {{ v.anio }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>{{ v.municipalidad }}</p>
        <ion-badge [color]="v.estado_permiso === 'PAGADO' ? 'success' : (v.estado_permiso === 'PARCIALMENTE_PAGADO' ?
'warning' : 'medium')">
          {{ v.estado_permiso.replace('_', ' ') }}
        </ion-badge>
      </ion-card-content>
    </ion-card>
  }
</ion-content>
